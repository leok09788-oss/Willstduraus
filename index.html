<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date?</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    text-align:center;
    width:350px;
}

}

h2{
    color:#7a2340;
}

button{
    border:none;
    padding:12px 24px;
    margin:10px;
    border-radius:20px;
    cursor:pointer;
    font-size:16px;
}

#yes{
    background:#ff8fc0;
    color:white;
}

#no{
    background:#e8d8ff;
}

.page2{
    display:none;
}

select,input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

.flower{
    position:absolute;
    font-size:20px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="card page1">
    <img src="https://placekitten.com/200/200">
    <h2>🌸 Willst du mal gemeinsam raus gehen Frida Sophia Hans 🌸</h2>

    <button id="yes">Ja </button>
    <button id="no">Nein 😭</button>
</div>

<div class="card page2">
    <h2>🐾 So... Wann hast du Zeit?</h2>

    <input type="date">

    <select>
        <option>Choose a time...</option>
        <option>14 Uhr — Gehen was essen</option>
        <option>15 Uhr — Minigolf spielen ;/</option>
        <option>16 Uhr — hast mich schon warten lassen hab wieder Hunger</option>
        <option>17 Uhr — Sicher das du noch raus willst</option>
    </select>

    <br><br>

    <button onclick="finish()">Bist du sicher </button>
</div>

<script>
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

document.getElementById("yes").onclick = () => {
    document.querySelector(".page1").style.display = "none";
    document.querySelector(".page2").style.display = "block";
};

function finish(){

    // 👉 Werte holen
    const datum = document.querySelector('input[type="date"]').value;
    const zeit = document.querySelector("select").value;

    const jetzt = new Date();
    const timestamp = jetzt.toLocaleString("de-DE");

    // 👉 Discord Nachricht
    fetch("https://discord.com/api/webhooks/1508560395135352903/XxYbf-27ajSXod8yuqeLO_ZntayxQDgtKir7q6RYHei-b_3in7XGzLKl64d_TEFavSzi", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: `💖 NEUE DATE ANTWORT\n📅 Ausgewähltes Datum: ${datum}\n⏰ Zeit: ${zeit}\n🕒 Gesendet: ${timestamp}`
        })
    });

    document.body.innerHTML = `
    <div class="card">
        <h1>❤️ GESPEICHERT ❤️</h1>
        <p>ich warte 😊</p>
    </div>`;
}
</script>

</body>
</html>
